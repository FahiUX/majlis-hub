<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <rect width="512" height="512" rx="112" fill="#481226"/>
  <!-- Subtle border -->
  <rect x="2" y="2" width="508" height="508" rx="110" stroke="#E5BE64" stroke-opacity="0.35" stroke-width="3"/>
  
  <g transform="translate(0, 0)">
    <!-- Roman Serif W (Didot Architecture) -->
    <!-- Left Stem Serif & Main Stroke -->
    <path d="M110 132 H172 M141 132 V155 M340 132 H402 M371 132 V155" stroke="#E5BE64" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Bold Main Downstrokes and Upstrokes -->
    <!-- Left Downstroke -->
    <path d="M141 146 L202 338 L256 182 L310 338 L371 146" stroke="#E5BE64" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Center Hairlines (Classic Serif Contrast) -->
    <path d="M141 146 L256 348 L371 146" stroke="#FAF7F4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- The Eternal Weave / Infinity Swash Ribbon -->
    <!-- Flowing through the baseline and around the stems -->
    <path d="M 74 330 C 52 375 92 418 152 396 C 218 372 242 278 298 288 C 354 298 424 382 438 334 C 448 290 398 252 344 268" 
          stroke="#E5BE64" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          
    <!-- Decorative Matrimonial Accent Spark at Swash Vertex -->
    <circle cx="256" cy="152" r="7" fill="#FAF7F4"/>
    <circle cx="256" cy="152" r="13" stroke="#E5BE64" stroke-width="2.5"/>
  </g>
</svg>